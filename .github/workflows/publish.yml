# Generated by listing-sync (infra scripts/listing_sync/connectors).
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dify:
    name: Dify plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      # The Marketplace's install check (langgenius/dify-plugins pre-check): the
      # plugin loads every tool YAML and class, then serves. `dify plugin
      # package` only reads the manifest, so this is the real validation. It runs
      # in the folder that is packaged next, so it must write no bytecode: the
      # Marketplace refuses a package carrying `__pycache__/`.
      - name: Load the plugin
        working-directory: dify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          INSTALL_METHOD: serverless
          SERVERLESS_HOST: 127.0.0.1
          SERVERLESS_PORT: "8080"
        run: |
          python -m pip install -r requirements.txt
          timeout 120 python -m main > "$RUNNER_TEMP/main.log" 2>&1 &
          pid=$!
          for _ in $(seq 90); do
            if grep -q "Serving Flask app" "$RUNNER_TEMP/main.log"; then kill "$pid"; exit 0; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/main.log"
          exit 1
      - name: Package
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dify" "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.14/dify-plugin-linux-amd64"
          chmod +x "$RUNNER_TEMP/dify"
          "$RUNNER_TEMP/dify" plugin package dify -o flatmark-1.0.16.difypkg
          if unzip -Z1 flatmark-1.0.16.difypkg | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "::error::flatmark-1.0.16.difypkg carries Python bytecode, which the Marketplace refuses"
            exit 1
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" flatmark-1.0.16.difypkg --clobber --repo "$GITHUB_REPOSITORY"
  langchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build
        run: uv build langchain --out-dir dist/langchain
      - name: Test the built wheel
        working-directory: langchain/tests
        run: uv run --isolated --no-project --with "$(ls ../../dist/langchain/*.whl)" python -m unittest discover -v
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/langchain/
          skip-existing: true
  pypi-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Generate the Python SDK
        run: >-
          uvx --from openapi-python-client==0.29.1 openapi-python-client generate
          --path openapi.sdk.json --config python/config.yml --meta uv
          --output-path build/python --overwrite
      - name: Build
        run: |
          cp python/README.md build/python/README.md
          uv build build/python --out-dir dist/python
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/python/
          skip-existing: true
