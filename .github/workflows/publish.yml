# Generated by listing-sync (infra scripts/listing_sync/connectors).
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dify:
    name: Dify plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      # The Marketplace's install check (langgenius/dify-plugins pre-check): the
      # plugin loads every tool YAML and class, then serves. `dify plugin
      # package` only reads the manifest, so this is the real validation. It runs
      # in the folder that is packaged next, so it must write no bytecode: the
      # Marketplace refuses a package carrying `__pycache__/`.
      - name: Load the plugin
        working-directory: dify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          INSTALL_METHOD: serverless
          SERVERLESS_HOST: 127.0.0.1
          SERVERLESS_PORT: "8080"
        run: |
          python -m pip install -r requirements.txt
          timeout 120 python -m main > "$RUNNER_TEMP/main.log" 2>&1 &
          pid=$!
          for _ in $(seq 90); do
            if grep -q "Serving Flask app" "$RUNNER_TEMP/main.log"; then kill "$pid"; exit 0; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/main.log"
          exit 1
      - name: Package
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dify" "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-amd64"
          chmod +x "$RUNNER_TEMP/dify"
          "$RUNNER_TEMP/dify" plugin package dify -o flatmark-1.0.3.difypkg
          if unzip -Z1 flatmark-1.0.3.difypkg | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "::error::flatmark-1.0.3.difypkg carries Python bytecode, which the Marketplace refuses"
            exit 1
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" flatmark-1.0.3.difypkg --clobber --repo "$GITHUB_REPOSITORY"
  langchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build
        run: uv build langchain --out-dir dist/langchain
      - name: Test the built wheel
        working-directory: langchain/tests
        run: uv run --isolated --no-project --with "$(ls ../../dist/langchain/*.whl)" python -m unittest discover -v
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/langchain/
          skip-existing: true
  make:
    runs-on: ubuntu-latest
    env:
      MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
      MAKE_ZONE: ${{ secrets.MAKE_ZONE }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm install -g @makehq/cli@1.4.0
      - run: bash make/deploy.sh
  n8n:
    name: n8n community node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.20.0
      - run: npm install
      # n8n-node release in Actions: lint, build, npm publish with provenance.
      - run: npm run release
      - name: Scan the published package
        run: |
          for _ in $(seq 30); do npm view "@flatmark-dev/n8n-nodes-flatmark@1.0.3" version && break; sleep 10; done
          out=$(npx --yes @n8n/scan-community-package@0.38.0 "@flatmark-dev/n8n-nodes-flatmark@1.0.3")
          echo "$out"
          grep -q "has passed all security checks" <<<"$out"
  npm-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - run: npm install --no-audit --no-fund
      - run: npm run generate
      - run: npm run build
      - run: npm publish --access public
  pypi-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generate the Python SDK
        run: >-
          uvx --from openapi-python-client==0.29.1 openapi-python-client generate
          --path openapi.sdk.json --config python/config.yml --meta uv
          --output-path build/python --overwrite
      - name: Build
        run: |
          cp python/README.md build/python/README.md
          uv build build/python --out-dir dist/python
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/python/
          skip-existing: true
  zapier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapier
    env:
      ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
      VERSION: "1.0.3"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm install
      - run: npx zapier-platform validate --without-style && npx zapier-platform push
      - name: Promote and migrate
        # The first promotion is the operator's public-listing request; after it,
        # each release is promoted and the previous version's users move over
        # (same major only: a new major is a breaking change).
        run: |
          set -o pipefail
          prev=$(npx zapier-platform versions --format json | jq -r '.[] | select(.State == "promoted") | .Version')
          if [ -z "$prev" ]; then
            echo "No promoted version yet: $VERSION stays private until the first promotion."
            exit 0
          fi
          if [ "$prev" = "$VERSION" ]; then
            exit 0
          fi
          npx zapier-platform promote "$VERSION" --yes
          if [ "${prev%%.*}" = "${VERSION%%.*}" ]; then
            npx zapier-platform migrate "$prev" "$VERSION" --yes
          fi
