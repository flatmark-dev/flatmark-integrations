# Generated by listing-sync (infra scripts/listing_sync/connectors).
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  n8n:
    name: n8n community node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.17.0
      - run: npm install
      # n8n-node release in Actions: lint, build, npm publish with provenance.
      - run: npm run release
      - name: Scan the published package
        run: |
          for _ in $(seq 30); do npm view "@flatmark-dev/n8n-nodes-flatmark@1.0.0" version && break; sleep 10; done
          out=$(npx --yes @n8n/scan-community-package@0.38.0 "@flatmark-dev/n8n-nodes-flatmark@1.0.0")
          echo "$out"
          grep -q "has passed all security checks" <<<"$out"
  npm-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: npm install --no-audit --no-fund
      - run: npm run generate
      - run: npm run build
      - run: npm publish --access public
  pypi-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Generate the Python SDK
        run: >-
          uvx --from openapi-python-client==0.29.1 openapi-python-client generate
          --path openapi.sdk.json --config python/config.yml --meta uv
          --output-path build/python --overwrite
      - name: Build
        run: |
          cp python/README.md build/python/README.md
          uv build build/python --out-dir dist/python
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/python/
          skip-existing: true
