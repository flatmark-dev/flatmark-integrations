identity:
  author: "podshalocef"
  name: "flatmark"
  label:
    en_US: "flatmark"
  description:
    en_US: "Document to Markdown API and MCP server for PDF, Word, PowerPoint, Excel and HTML. OCR queue for large files. Hosted in Germany."
  icon: "icon.svg"
  tags:
    - "productivity"
    - "utilities"
credentials_for_provider:
  x_api_key:
    type: "secret-input"
    required: false
    label:
      en_US: "flatmark API key (optional)"
    placeholder:
      en_US: "Leave empty to use the free daily allowance"
    help:
      en_US: "Get a free flatmark API key"
    url: "https://flatmark.dev/go/dify?to=/app/api-keys"
tools:
  - "tools/get_me.yaml"
  - "tools/get_job.yaml"
  - "tools/list_jobs.yaml"
  - "tools/convert_document.yaml"
  - "tools/submit_conversion_job.yaml"
  - "tools/get_conversion_result.yaml"
extra:
  python:
    source: "provider/flatmark.py"
